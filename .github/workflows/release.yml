name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: test "v$(node -p "require('./npm/slop-police/package.json').version")" = "$GITHUB_REF_NAME"

      - run: go test ./...

      - run: node scripts/build-npm.mjs

      - name: Publish
        run: |
          for dir in dist/npm/slop-police-*/ dist/npm/slop-police/; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish "$dir" --provenance --access public
            fi
          done

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "npm i -D slop-police@${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
