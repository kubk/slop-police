name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      matrix:
        platform: [darwin-arm64, darwin-x64, linux-arm64, linux-x64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: node scripts/build-npm.mjs ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: slop-police-${{ matrix.platform }}
          path: dist/npm/slop-police-${{ matrix.platform }}

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Building the main package compiles TypeScript's JS API with go tool tsgo.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: test "v$(node -p "require('./npm/slop-police/package.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v8
        with:
          path: dist/npm

      - name: Restore executable bits dropped by artifacts
        run: chmod +x dist/npm/slop-police-*/bin/slop-police

      - run: node scripts/build-npm.mjs main

      - name: Publish
        run: |
          for dir in dist/npm/slop-police-*/ dist/npm/slop-police/; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish "$dir" --provenance --access public
            fi
          done

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "npm i -D slop-police@${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
