name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: $/.github/workflows/ci.yml

  build:
    strategy:
      matrix:
        platform: [darwin-arm64, darwin-x64, linux-arm64, linux-x64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release builds skip the Actions cache so a poisoned cache entry cannot reach published packages.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: node scripts/build-npm.mjs ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slop-police-${{ matrix.platform }}
          path: dist/npm/slop-police-${{ matrix.platform }}

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Full history and tags let the release notes list commits since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Building the main package compiles TypeScript's JS API with go tool tsgo.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: test "v$(node -p "require('./npm/slop-police/package.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/npm

      - name: Restore executable bits dropped by artifacts
        run: chmod +x dist/npm/slop-police-*/bin/slop-police

      - run: node scripts/build-npm.mjs main

      - name: Publish
        run: |
          for dir in dist/npm/slop-police-*/ dist/npm/slop-police/; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish "$dir" --provenance --access public
            fi
          done

      - name: Create GitHub release
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          git log --reverse --invert-grep --grep '^Release ' \
            --format="- [%s]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H)" "$prev..$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
