name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - assets/**
      - .agents/**
      - .claude/**
      - LICENSE
  pull_request:
    paths-ignore: *docs
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - parallel:
          - name: Vet
            run: go vet ./...
          - name: Test
            run: go test ./...
          - name: Test plugins
            run: |
              go build -o "$RUNNER_TEMP/slop-police" ./cmd/slop-police
              node scripts/build-typescript-api.mjs
              SLOP_POLICE_BINARY="$RUNNER_TEMP/slop-police" node --test "npm/slop-police/test/*.test.js"
